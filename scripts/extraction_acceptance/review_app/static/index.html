<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Extraction Acceptance Review</title>
  <link rel="stylesheet" href="/static/app.css"/>
</head>
<body>
  <header class="top">
    <h1>Extraction Acceptance Review</h1>
    <p class="banner">Technical extraction review only — not law-firm fact review.
      Machine suggestions are <strong>UNVERIFIED MACHINE OUTPUT</strong>. Use
      <code>http://127.0.0.1</code> only (not file://).</p>
  </header>

  <section class="filters">
    <label>Status
      <select id="filter-status">
        <option value="">All</option>
        <option value="unreviewed">Unreviewed / prefill</option>
        <option value="in_review">In review</option>
        <option value="human_reviewed">Reviewed</option>
        <option value="needs_second_review">Needs second review</option>
        <option value="unreadable">Unreadable</option>
      </select>
    </label>
    <label>Family
      <select id="filter-family">
        <option value="">All</option>
        <option value="police">Police forms</option>
        <option value="handwriting">Handwriting</option>
        <option value="corrupt_hidden_ocr">Corrupt hidden OCR</option>
        <option value="tables">Tables</option>
      </select>
    </label>
    <label>Route
      <select id="filter-route">
        <option value="">All</option>
        <option value="native">Native</option>
        <option value="ocr">OCR</option>
      </select>
    </label>
    <button type="button" id="apply-filters">Apply</button>
  </section>

  <p id="count"></p>
  <table id="pages-table">
    <thead>
      <tr>
        <th>Case</th>
        <th>Document</th>
        <th>Page</th>
        <th>Challenge</th>
        <th>Machine</th>
        <th>Status</th>
        <th>Critical</th>
        <th>Text</th>
        <th>Order</th>
        <th>Geom</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="/static/dashboard.js"></script>
</body>
</html>
