[project]
name = "veridemand"
version = "0.1.0"
description = "VeriDemand runtime-only document-extraction platform API (Phase 0 foundation)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "VeriDemand" }]
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-dotenv>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "sse-starlette>=2.1,<4.0",
  "pypdf>=5.1,<6.0",
  "Pillow>=11.0,<12.0",
  "oletools>=0.60,<1.0",
  "defusedxml>=0.7,<1.0",
  "reportlab>=4.0,<5.0",
  "pdfplumber>=0.11.9",
  "pypdfium2==5.12.1",
  "numpy>=2.0,<3.0",
  "onnxruntime>=1.19,<2.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.17,<2.0",
]
ocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.0",
  "pypdfium2==5.12.1",
  "numpy>=2.0,<3.0",
  "psutil>=6.0,<8.0",
]
model-dev = [
  "onnx>=1.16,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "scripts"]
extend-exclude = ["frontend", ".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]
# Fixture PDF generator: disposable ReportLab script, not production API code.
"scripts/generate_veridemand_regression_pdf.py" = ["ALL"]
# Loopback HTML UIs embed long inline JS/CSS strings.
"scripts/phase5/handwriting_seed_server.py" = ["E501", "RUF001"]
"scripts/phase5/labeler_server.py" = ["E501", "RUF001"]
"scripts/phase5/coverage_server.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "scripts"]
plugins = ["pydantic.mypy"]
exclude = [
  "^frontend/",
  "^\\.venv/",
  "^scripts/generate_veridemand_regression_pdf\\.py$",
]

[[tool.mypy.overrides]]
module = ["backend.tests.*"]
disallow_untyped_defs = false

# Third-party upload-validation libraries without type stubs (used only for
# structural validation). Their imports are treated as untyped.
[[tool.mypy.overrides]]
module = ["defusedxml.*", "olefile", "olefile.*", "oletools.*", "reportlab.*", "pdfplumber.*", "pdfminer.*", "pypdfium2.*", "paddleocr.*", "paddle.*", "numpy.*", "psutil.*", "PIL.*", "onnxruntime", "onnxruntime.*", "onnx", "onnx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.generate_veridemand_regression_pdf"]
ignore_errors = true
