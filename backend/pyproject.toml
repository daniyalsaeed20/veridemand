[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veridemand-backend"
version = "0.0.0-dev"
description = "VeriDemand Phase 1 FastAPI backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "VeriDemand" }]
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pypdf==5.9.0",
  "pillow==11.3.0",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pypdf.*", "PIL.*"]
ignore_missing_imports = true
