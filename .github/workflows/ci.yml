name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test, contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies (frozen)
        run: uv sync --frozen --all-groups

      - name: Install Node dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Verify contracts (no drift)
        run: pnpm contracts:check

      - name: Run validation suite (excluding E2E)
        run: uv run python scripts/check_all.py --skip-e2e

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # No secrets are provided to this job: the runtime-session/upload/queue flows
    # are fully offline and must never call a live vision provider.
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (frozen)
        run: |
          uv sync --frozen --all-groups
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C frontend exec playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: pnpm test:e2e

      - name: Verify no residual session data
        if: always()
        run: uv run python scripts/check_no_residual_sessions.py

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
